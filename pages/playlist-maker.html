.pm{max-width:1180px;margin:0 auto;padding:0 18px 120px}
.pm-lead{color:#C6CEDC;line-height:1.6;font-size:14px;margin:6px 0 22px}
.pm-key{display:flex;flex-wrap:wrap;align-items:center;gap:10px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:12px 14px;font-size:13px;margin-bottom:22px}
.pm-key .dot{width:9px;height:9px;border-radius:50%;background:#e0524d;flex-shrink:0}
.pm-key.ok .dot{background:#3fbf74}
.pm-key input{flex:1;min-width:180px;background:rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.16);border-radius:8px;color:#fff;padding:8px 10px;font-family:inherit;font-size:13px}
.pm-key button{background:var(--blue,#2E6FC9);color:#fff;border:0;border-radius:8px;padding:8px 14px;font-weight:900;cursor:pointer;font-family:inherit;font-size:13px}
.pm-key a{color:var(--blue-300,#7FA9E0)}
.pm-form{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:720px){.pm-form{grid-template-columns:1fr}}
.pm-fld label{display:block;font-size:13px;font-weight:900;color:#e6edf3;margin:0 0 7px}
.pm-fld input,.pm-fld textarea{width:100%;background:rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.16);border-radius:10px;color:#fff;padding:11px 13px;font-family:inherit;font-size:14px;box-sizing:border-box}
.pm-fld textarea{min-height:60px;resize:vertical}
.pm-fld.full{grid-column:1/-1}
.pm-run{margin:20px 0 0;display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.pm-btn{background:linear-gradient(135deg,#2E6FC9,#5B47A8);color:#fff;border:0;border-radius:12px;padding:13px 24px;font-weight:900;font-size:15px;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:8px}
.pm-btn:disabled{opacity:.5;cursor:not-allowed}
.pm-hint{color:#7c8699;font-size:12.5px}
.pm-sec-t{font-size:15px;font-weight:900;color:#fff;margin:34px 0 6px;display:flex;align-items:center;gap:8px}
.pm-sec-s{color:#9aa6bc;font-size:13px;margin:0 0 14px}
.pm-titles{display:flex;flex-direction:column;gap:9px}
.pm-title{text-align:left;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.12);border-radius:11px;padding:13px 15px;cursor:pointer;transition:.14s;color:#e6edf3;font-family:inherit;font-size:14px;display:flex;gap:11px;align-items:flex-start}
.pm-title:hover{border-color:rgba(127,169,224,.6);background:rgba(127,169,224,.08)}
.pm-title.sel{border-color:#5B47A8;background:rgba(91,71,168,.16)}
.pm-title .n{flex-shrink:0;width:24px;height:24px;display:inline-flex;align-items:center;justify-content:center;border-radius:7px;background:rgba(46,111,201,.5);color:#fff;font-weight:900;font-size:12px}
.pm-out{background:#0a0d13;border:1px solid rgba(127,169,224,.28);border-radius:16px;padding:18px;margin-top:14px}
.pm-out pre{white-space:pre-wrap;word-break:break-word;font-family:'Noto Sans Mono',ui-monospace,monospace;font-size:12.5px;line-height:1.65;color:#dbe4ef;margin:0}
.pm-copy{background:rgba(127,169,224,.16);color:#cfe0f5;border:1px solid rgba(127,169,224,.34);border-radius:9px;padding:8px 14px;font-weight:900;font-size:13px;cursor:pointer;font-family:inherit;margin-bottom:12px}
.pm-load{color:#9aa6bc;font-size:14px;padding:18px;text-align:center}
.pm-err{background:rgba(224,82,77,.12);border:1px solid rgba(224,82,77,.4);color:#f0b4b1;border-radius:12px;padding:14px 16px;font-size:13.5px;margin-top:14px}
.pm-spin{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:pmspin .7s linear infinite;vertical-align:-2px}
@keyframes pmspin{to{transform:rotate(360deg)}}

<div class="main" id="main" tabindex="-1">
  <section class="section" style="padding-top:20px">
    <div class="wrap pm">
      <div class="sec-head"><h2 class="sec-en" style="display:flex;align-items:center;gap:10px"><svg aria-hidden="true" width="24" height="24" style="color:#7FA9E0"><use href="#i-list"/></svg>PLAYLIST UPDATE MAKER</h2><p class="sec-ko">플레이리스트 업데이트 메이커 — 제목·설명·태그·번역</p></div>
      <p class="pm-lead">장르·타겟·상황만 알려주면 <b>클릭을 부르는 감성 제목 10개</b>와 <b>수익화(재사용 콘텐츠 판정) 방어용 설명</b>을 만들고, 제목을 고르면 <b>스튜디오 태그 40개+</b>와 <b>50개국어 현지화 번역</b>까지 이어서 생성합니다.</p>

      <div class="pm-key" id="keyBar">
        <span class="dot"></span>
        <span id="keyStat" style="flex-shrink:0">Gemini 연결 확인 중…</span>
        <input id="gkey" type="password" placeholder="Gemini API 키 (AIza…) — 없으면 기본 키 사용" autocomplete="off">
        <button id="keySave" type="button">저장</button>
        <span class="pm-hint">키 발급: <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">aistudio.google.com/apikey</a> · 키는 이 브라우저에만 저장</span>
      </div>

      <div class="pm-form">
        <div class="pm-fld"><label for="genre">음악 장르</label><input id="genre" placeholder="예: Lo-fi R&B, City Pop, 잔잔한 피아노"></div>
        <div class="pm-fld"><label for="target">타겟 시청자</label><input id="target" placeholder="예: 새벽에 공부하는 20대, 카페 사장님"></div>
        <div class="pm-fld full"><label for="situation">상황 · 무드 (언제 듣는 곡인지)</label><textarea id="situation" placeholder="예: 비 오는 밤 혼자 작업할 때, 도시의 밤 드라이브, 잠들기 전 힐링"></textarea></div>

        <span class="pm-hint">장르·타겟·상황을 채우면 더 정확합니다.</span>

      <div id="stage"></div>

<script src="../home/cr-keys.js?v=1"></script>
<script src="../home/tool-store.js"></script>
<script>
(function(){
  var $=function(s,r){return (r||document).querySelector(s);};
  var GK='starnauts_key_gemini', MODEL='gemini-2.5-flash';

  function effKey(){ return (localStorage.getItem(GK)||'').trim() || (window.__CR_DEFAULT_KEYS&&window.__CR_DEFAULT_KEYS.gem)||''; }
  function refreshKey(){
    var bar=$('#keyBar'), stat=$('#keyStat'), has=!!effKey(), own=!!(localStorage.getItem(GK)||'').trim();
    bar.classList.toggle('ok',has);
    stat.textContent = own ? 'Gemini 내 키 연결됨' : (has ? 'Gemini 기본 키로 작동 중' : '키를 등록해 주세요');
    $('#gkey').value=(localStorage.getItem(GK)||'');
  }
  $('#keySave').addEventListener('click',function(){ var v=$('#gkey').value.trim(); if(v)localStorage.setItem(GK,v); else localStorage.removeItem(GK); refreshKey(); });
  refreshKey();

  function callGemini(system,userText,cfg){
    var k=effKey(); if(!k) return Promise.reject({message:'Gemini 키가 없어요. 상단에서 키를 등록해 주세요.'});
    var body={ system_instruction:{parts:[{text:system}]},
      contents:[{role:'user',parts:[{text:userText}]}],
      generationConfig: cfg||{temperature:0.85,topP:0.95,maxOutputTokens:8192} };
    return fetch('https://generativelanguage.googleapis.com/v1beta/models/'+MODEL+':generateContent?key='+encodeURIComponent(k),
      {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})
      .then(function(res){ return res.json().catch(function(){return{};}).then(function(d){
        if(!res.ok){ var e=d&&d.error&&d.error.message; throw {message: e? ('Gemini 오류: '+e) : ('응답 오류(HTTP '+res.status+')')}; }
        var c=d&&d.candidates&&d.candidates[0];
        if(!c){ if(d&&d.promptFeedback&&d.promptFeedback.blockReason) throw {message:'안전 필터에 걸렸어요('+d.promptFeedback.blockReason+').'}; throw {message:'빈 응답을 받았어요.'}; }
        var t=((c.content&&c.content.parts)||[]).map(function(p){return p.text||'';}).join('').trim();
        if(!t) throw {message:'응답 텍스트가 비어 있어요.'}; return t;
      }); },function(){ throw {message:'네트워크 오류예요. 연결을 확인해 주세요.'}; });
  }

  /* ── 시스템 지침 (플레이리스트 제목·설명·번역 무드 메이커 Gem) ── */
  var SYS_TITLES =
    'You are a YouTube Playlist Strategist & Global Branding Consultant. '+
    'Goal: help creators avoid "Reused Content" claims, secure YouTube Partner Program (YPP) monetization, and optimize localized + global SEO. '+
    'Tone: professional yet deeply empathetic and collaborative. No greeting filler, no conversational fluff. '+
    'Given the user\'s music genre / target audience / situation-mood, output ONLY [Step 1] and [Step 2] in Korean. Do NOT output tags or translations yet.\n\n'+
    '[Step 1] 클릭을 부르는 한국어 제목 10개 (번호 목록 1~10).\n'+
    '- 반드시 [구체적 상황/장면] + [핵심 감정] + [장르/무드 SEO 키워드] 구조.\n'+
    '- 정확히 10개 중 1개만 장식용 유니코드 이탤릭체(예: 𝐏𝐥𝐚𝐲𝐥𝐢𝐬𝐭)를 제목 앞에 사용. 나머지 9개는 일반 텍스트 + 상황에 맞는 이모지 1~2개.\n'+
    '- 각 제목은 반드시 "번호. 제목" 형식의 한 줄로.\n\n'+
    '[Step 2] 수익화 승인용 설명 (복사용):\n'+
    '- 감성 내러티브 3~4줄 (큐레이션의 무드·스토리텔링).\n'+
    '- 제작 노트: 크리에이터가 직접 "곡 선별 / 순서 배치 / 음량 밸런싱"을 했음을 명시(재사용 콘텐츠가 아닌 독창적 큐레이션임을 검토관에게 각인).\n'+
    '- 타임라인 플레이스홀더: [00:00] 곡명 - 아티스트 형식 예시 몇 줄.\n'+
    '- 해시태그 세트: # 로 시작하는 핵심 해시태그 약 10개.\n\n'+
    'Constraints: 이미지 생성 금지. 이탤릭체는 정확히 1/10만. 설명란 태그는 #, 스튜디오 태그는 쉼표(,) — 절대 혼용 금지(단, 여기선 스튜디오 태그는 아직 출력하지 않음).';

  var SYS_TAGS =
    'You are a YouTube Playlist Strategist & Global Branding Consultant. No greeting filler. '+
    'The user provides their inputs and a CHOSEN title. Output ONLY [Step 3] and [Step 4] in Korean.\n\n'+
    '[Step 3] 스튜디오 태그 (40개 이상): 쉼표(,)로만 구분한 하나의 큰 블록. # 사용 금지. '+
    '장르, 무드, 구체적 상황, 타겟 시청자, 유사 아티스트, 글로벌 에버그린 키워드를 모두 포함.\n\n'+
    '[Step 4] 선택한 제목의 50개 주요 언어 현지화 번역:\n'+
    '- 직역 금지. 각 국가의 실제 검색 습관을 반영(예: 일본어 作業用BGM, 영어 Vibes/Chill, 중국어 治愈).\n'+
    '- 각 줄 형식: 언어명(한국어로) : 현지화된 제목.  예) 일본어 : ...\n'+
    '- 실제 사용 빈도 높은 50개 언어를 다룬다.\n\n'+
    'Constraints: 이미지 생성 금지. 스튜디오 태그는 반드시 쉼표(,)로만 구분.';

  function esc(s){ return (s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function copyBtn(id,getText,label){
    var b=$('#'+id); if(!b)return;
    b.addEventListener('click',function(){
      var t=getText(), cb=this;
      (navigator.clipboard&&navigator.clipboard.writeText?navigator.clipboard.writeText(t):Promise.reject())
        .then(function(){ cb.innerHTML='<svg aria-hidden="true" width="14" height="14" style="vertical-align:-2px"><use href="#i-check"/></svg> 복사됨'; setTimeout(function(){ cb.innerHTML=label; },1300); })
        .catch(function(){ var ta=document.createElement('textarea'); ta.value=t; document.body.appendChild(ta); ta.select(); try{document.execCommand('copy');}catch(e){} document.body.removeChild(ta); cb.textContent='복사됨'; });
    });
  }
  function inputs(){ return { genre:$('#genre').value.trim(), target:$('#target').value.trim(), situation:$('#situation').value.trim() }; }
  function inputText(v){ return '음악 장르: '+(v.genre||'(미입력)')+'\n타겟 시청자: '+(v.target||'(미입력)')+'\n상황·무드: '+(v.situation||'(미입력)'); }

  var lastTitlesText='';
  /* ── 1단계: 제목 10 + 설명 ── */
  $('#gen').addEventListener('click',function(){
    var v=inputs();
    if(!v.genre && !v.situation){ alert('장르 또는 상황·무드 중 하나는 입력해 주세요.'); return; }
    var stage=$('#stage');
    stage.innerHTML='<div class="pm-load"><span class="pm-spin"></span> 감성 제목 10개와 수익화 설명을 만드는 중…</div>';
    callGemini(SYS_TITLES, inputText(v)+'\n\n위 정보로 [Step 1] 제목 10개와 [Step 2] 설명을 만들어줘.', {temperature:0.9,maxOutputTokens:4096})
      .then(function(txt){
        lastTitlesText=txt;
        // 제목 파싱 (번호. 제목)
        var titles=[]; txt.split(/\r?\n/).forEach(function(ln){ var m=ln.match(/^\s*(\d{1,2})[.)]\s*(.+?)\s*$/); if(m && +m[1]>=1 && +m[1]<=10 && titles.length<10) titles.push(m[2]); });
        var pick = titles.length ? '<div class="pm-sec-t"><svg aria-hidden="true" width="18" height="18"><use href="#i-list"/></svg>제목 10개 — 마음에 드는 것을 고르세요</div>'+
            '<p class="pm-sec-s">제목을 선택하면 스튜디오 태그 40개+와 50개국어 번역이 생성됩니다.</p>'+
            '<div class="pm-titles">'+titles.map(function(t,i){ return '<button type="button" class="pm-title" data-i="'+i+'"><span class="n">'+(i+1)+'</span><span>'+esc(t)+'</span></button>'; }).join('')+'</div>' : '';
        stage.innerHTML=pick+
          '<div class="pm-out" style="margin-top:16px"><button type="button" class="pm-copy" id="cpTitles"><svg aria-hidden="true" width="14" height="14" style="vertical-align:-2px"><use href="#i-copy"/></svg> 제목+설명 전체 복사</button><pre id="preTitles">'+esc(txt)+'</pre></div>'+
          '<div id="result"></div>';
        copyBtn('cpTitles',function(){return lastTitlesText;},'<svg aria-hidden="true" width="14" height="14" style="vertical-align:-2px"><use href="#i-copy"/></svg> 제목+설명 전체 복사');
        window.__PM_TITLES=titles;
        Array.prototype.forEach.call(document.querySelectorAll('.pm-title'),function(b){
          b.addEventListener('click',function(){
            Array.prototype.forEach.call(document.querySelectorAll('.pm-title'),function(x){x.classList.remove('sel');});
            b.classList.add('sel');
            genTags(titles[+b.getAttribute('data-i')]);
          });
        });
        // 기록 저장 (계정별)
        if(window.ToolStore){ window.ToolStore.save({tool:'playlist-maker',toolName:'플레이리스트 업데이트 메이커',shared:false,summary:'플리 제목·설명 — '+(v.genre||v.situation||'').slice(0,40),result:txt}); }
      })
      .catch(function(e){ stage.innerHTML='<div class="pm-err">'+esc((e&&e.message)||'생성에 실패했어요.')+'</div>'; });
  });

  /* ── 2단계: 태그 40+ + 50개국어 번역 ── */
  function genTags(title){
    var res=$('#result'), v=inputs();
    res.innerHTML='<div class="pm-load"><span class="pm-spin"></span> "'+esc(title)+'" 태그 40개+와 50개국어 번역을 만드는 중…</div>';
    callGemini(SYS_TAGS, inputText(v)+'\n\n선택한 제목: '+title+'\n이 제목으로 [Step 3] 스튜디오 태그와 [Step 4] 50개국어 번역을 만들어줘.', {temperature:0.7,maxOutputTokens:8192})
      .then(function(txt){
        res.innerHTML='<div class="pm-out"><button type="button" class="pm-copy" id="cpTags"><svg aria-hidden="true" width="14" height="14" style="vertical-align:-2px"><use href="#i-copy"/></svg> 태그+번역 전체 복사</button><pre id="preTags">'+esc(txt)+'</pre></div>';
        copyBtn('cpTags',function(){return txt;},'<svg aria-hidden="true" width="14" height="14" style="vertical-align:-2px"><use href="#i-copy"/></svg> 태그+번역 전체 복사');
        if(window.ToolStore){ window.ToolStore.save({tool:'playlist-maker',toolName:'플레이리스트 업데이트 메이커',shared:false,summary:'태그·번역 — '+title.slice(0,40),result:txt}); }
        res.scrollIntoView({behavior:'smooth',block:'nearest'});
      })
      .catch(function(e){ res.innerHTML='<div class="pm-err">'+esc((e&&e.message)||'생성에 실패했어요.')+'</div>'; });
  }
})();
</script>
